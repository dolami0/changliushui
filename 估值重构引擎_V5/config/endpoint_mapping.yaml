# investoday-api endpoint mapping
# DataFetcher hardcodes CLI paths today; this file is loaded at init.
# The original 389-line mapping was never in git (config/ was gitignored)
# and was not found in sibling dolami0 repos. This stub is enough for
# DataFetcher / IndustryChainWorkflow / WangqiScheduler to construct.
# Paths below match docs/01_\u73af\u5883\u914d\u7f6e.md layer list.

version: 1
source: stub
description: minimal mapping so engine boot does not FileNotFoundError

layers:
  1_company_snapshot:
    priority: P0
    endpoints:
      - path: stock-quote/realtime
        method: GET
        note: 实时行情
      - path: stock/finance/valuation
